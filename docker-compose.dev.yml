# ChessMaster — development stack with live reload. Nothing to install locally except Docker.
#
#   docker compose -f docker-compose.dev.yml up
#
# Open http://localhost:5173. Edits under backend/src restart the API, and
# edits under frontend/src reload the page.

name: chessmaster-dev

services:
  backend:
    image: node:22-alpine
    working_dir: /app
    # nodemon polls for changes; plain `node --watch` misses edits made on a Windows/macOS host.
    command: sh -c "npm ci && npx nodemon --legacy-watch --watch src src/server.js"
    init: true
    environment:
      PORT: 3001
    ports:
      - "3001:3001"
    volumes:
      - ./backend:/app
      # Keep the container's node_modules separate from the host's (they can differ by OS).
      - backend_node_modules:/app/node_modules

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npx vite --host 0.0.0.0"
    environment:
      API_PROXY_TARGET: http://backend:3001
      VITE_USE_POLLING: "1"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  backend_node_modules:
  frontend_node_modules:
